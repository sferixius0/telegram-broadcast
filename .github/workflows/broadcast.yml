name: Telegram Broadcast

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:       # возможность запустить вручную

permissions:
  contents: write          # разрешение на запись в репозиторий (для last_index.txt)

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install telethon

      - name: Run broadcast
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE: ${{ secrets.PHONE }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
        run: python broadcast.py

      - name: Commit last_index.txt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_index.txt
          git commit -m "Update index" || echo "No changes"
          git push
